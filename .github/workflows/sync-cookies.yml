name: Auto-Sync IMDb Cookies to Cloudflare KV

on:
  schedule:
    # Backup trigger every 4 hours
    - cron: "0 */4 * * *"
  workflow_dispatch: # Allows manual 1-click execution or auto-chaining
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/sync-cookies.yml"

concurrency:
  group: sync-cookies-group
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 hours max GitHub runner timeout

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm install --include=dev

      - name: Run Self-Chaining Continuous Cloud Cookie Sync
        env:
          WORKER_URL: "https://meta.1proxy.workers.dev"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/sync-cookies.mjs --daemon --interval=20 --max-hours=4.2 --auto-chain
