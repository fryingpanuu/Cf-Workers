name: Auto-Sync IMDb Cookies to Cloudflare KV

on:
  schedule:
    # Trigger every 4 hours to start a continuous 4.5-hour refresh loop
    - cron: "0 */4 * * *"
  workflow_dispatch: # Allows manual 1-click execution in GitHub Actions UI
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/sync-cookies.yml"

concurrency:
  group: sync-cookies-group
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 hours max GitHub runner timeout

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm install --include=dev

      - name: Run 4.5-Hour Continuous Cloud Cookie Sync
        env:
          WORKER_URL: "https://meta.1proxy.workers.dev"
        run: node scripts/sync-cookies.mjs --daemon --interval=20 --max-hours=4.5
