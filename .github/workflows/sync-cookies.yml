name: Sync IMDb Cookies to Cloudflare KV

on:
  workflow_dispatch: # Manual 1-click execution when needed

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm install --include=dev

      - name: Sync Cookies (One-shot)
        env:
          WORKER_URL: "https://meta.1proxy.workers.dev"
        run: node scripts/sync-cookies.mjs
