name = "meta"
main = "src/imdb-worker/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
account_id = "95ca409478611e8065d9343f0f22312e"
workers_dev = true

# Browser Rendering Binding (optional fallback)
browser = { binding = "MYBROWSER" }

# KV Namespace Binding for storing IMDb cookies
kv_namespaces = [
  { binding = "COOKIE_KV", id = "104aa3bf24da4377a2f781c9eda72996", preview_id = "5b6d20c068604448a2c45cc4285b69b2" }
]

# Cloudflare Cron Trigger (Runs every 20 minutes with second-precision)
[triggers]
crons = ["*/20 * * * *"]

[vars]
GH_REPO = "fryingpanuu/Cf-Workers"
